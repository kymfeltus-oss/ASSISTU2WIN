<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#02040a" />
    <title>Assist U 2 Win</title>
    <style>
      :root {
        /* Matches splash PNG edge pixels — seamless letterboxing on all devices */
        --intro-bg: #02040a;
        --intro-aspect: 1086 / 1448;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --view-w: calc(100vw - var(--safe-left) - var(--safe-right));
        --view-h: calc(100dvh - var(--safe-top) - var(--safe-bottom));
        --view-h-sv: calc(100svh - var(--safe-top) - var(--safe-bottom));
        --cyan: #00f2fe;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        background: var(--intro-bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: var(--intro-bg);
        color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /*
       * One rule set for phone, tablet, desktop:
       * - Page background = image edge color (no visible box)
       * - Art scales to largest size that fits viewport (contain)
       * - Overlays track the art box, not the viewport
       */
      .intro-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        height: 100dvh;
        height: 100svh;
        padding:
          var(--safe-top)
          var(--safe-right)
          var(--safe-bottom)
          var(--safe-left);
        background: var(--intro-bg);
        overflow: hidden;
      }

      .intro-art-stage {
        container-type: size;
        position: relative;
        flex-shrink: 0;
        /* One sizing rule: largest box that fits viewport while keeping PNG aspect */
        width: min(var(--view-w), calc(var(--view-h) * 1086 / 1448));
        height: min(calc(var(--view-w) * 1448 / 1086), var(--view-h), var(--view-h-sv));
        max-width: 100%;
        aspect-ratio: var(--intro-aspect);
        max-height: min(var(--view-h), var(--view-h-sv));
      }

      .intro-art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .intro-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .intro-overlay > * {
        pointer-events: auto;
      }

      .features-grid {
        position: absolute;
        left: 3.2%;
        right: 3.2%;
        top: 31.5%;
        height: 11.5%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(4px, 1.2vw, 10px);
      }

      .feature-card {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        cursor: pointer;
        font: inherit;
        color: inherit;
        touch-action: manipulation;
        transition:
          background 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .feature-card:hover,
      .feature-card:focus-visible {
        background: rgba(0, 242, 254, 0.05);
        border-color: rgba(0, 242, 254, 0.18);
        box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        outline: none;
      }

      /* Hides status bar / copy baked into intro.png; CTA sits in this band */
      .intro-bottom-mask {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        height: 22%;
        pointer-events: none;
        background: linear-gradient(
          to top,
          var(--intro-bg) 0%,
          var(--intro-bg) 85%,
          transparent 100%
        );
      }

      /* CTA band — lower on art, sized to the splash stage */
      .enter-zone {
        position: absolute;
        z-index: 2;
        left: 10%;
        right: 10%;
        bottom: 8%;
        height: 7%;
        min-height: 44px;
        max-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .enter-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        max-height: 100%;
        padding: 0 clamp(12px, 3.5cqw, 22px);
        border-radius: clamp(10px, 1.4cqw, 14px);
        border: 1px solid rgba(0, 242, 254, 0.75);
        background: linear-gradient(180deg, #00f2fe, #0ea5e9 55%, #0369a1);
        color: #fff;
        font-size: clamp(10px, 3.2cqw, 14px);
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow:
          0 0 28px rgba(0, 242, 254, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        touch-action: manipulation;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .enter-btn:hover {
        box-shadow: 0 0 36px rgba(0, 242, 254, 0.52);
      }

      .enter-btn:active {
        transform: scale(0.98);
      }

    </style>
  </head>
  <body>
    <main class="intro-shell">
      <div class="intro-art-stage" id="intro-art-stage">
        <img
          id="intro-art"
          class="intro-art"
          src="/intro.png"
          alt="Assist U 2 Win — The Home Buying Collective"
          width="1086"
          height="1448"
          decoding="async"
          fetchpriority="high"
        />

        <div class="intro-overlay" aria-hidden="false">
          <div class="features-grid" role="group" aria-label="Platform features">
            <button
              type="button"
              class="feature-card"
              aria-label="AI powered intelligent insights"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Smarter decisions data driven results"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Maximum value optimize every move"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Trusted system secure reliable proven"
            ></button>
          </div>

          <div class="intro-bottom-mask" aria-hidden="true"></div>

          <div class="enter-zone">
            <a href="/dashboard" class="enter-btn">ENTER TO WIN</a>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        // #region agent log
        var ENDPOINT =
          "http://127.0.0.1:7764/ingest/a95af5bd-0217-4f46-848b-1173c2c72d98";
        function log(hypothesisId, message, data) {
          fetch(ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Debug-Session-Id": "3fd78e",
            },
            body: JSON.stringify({
              sessionId: "3fd78e",
              runId: "intro-cta-lower",
              hypothesisId: hypothesisId,
              location: "intro.html:debug",
              message: message,
              data: data,
              timestamp: Date.now(),
            }),
          }).catch(function () {});
        }

        function measure() {
          var img = document.getElementById("intro-art");
          var stage = document.getElementById("intro-art-stage");
          var shell = document.querySelector(".intro-shell");
          if (!img || !stage || !shell) return;

          var imgRect = img.getBoundingClientRect();
          var stageRect = stage.getBoundingClientRect();
          var shellRect = shell.getBoundingClientRect();
          var imgStyle = window.getComputedStyle(img);

          log("A", "object-fit mode", {
            objectFit: imgStyle.objectFit,
            objectPosition: imgStyle.objectPosition,
          });
          log("B", "viewport vs stage", {
            innerWidth: window.innerWidth,
            innerHeight: window.innerHeight,
            shellW: Math.round(shellRect.width),
            shellH: Math.round(shellRect.height),
            stageW: Math.round(stageRect.width),
            stageH: Math.round(stageRect.height),
            imgW: Math.round(imgRect.width),
            imgH: Math.round(imgRect.height),
          });
          log("C", "overlay alignment", {
            stageMatchesImg:
              Math.abs(stageRect.width - imgRect.width) < 2 &&
              Math.abs(stageRect.height - imgRect.height) < 2,
          });
          log("D", "natural aspect", {
            naturalW: img.naturalWidth,
            naturalH: img.naturalHeight,
            aspect: img.naturalWidth / img.naturalHeight,
          });
          log("E", "fill ratio", {
            widthFill: imgRect.width / shellRect.width,
            heightFill: imgRect.height / shellRect.height,
          });
          var enterZone = document.querySelector(".enter-zone");
          var enterRect = enterZone
            ? enterZone.getBoundingClientRect()
            : null;
          log("F", "cta placement", {
            hasLoadingZone: !!document.querySelector(".loading-zone"),
            hasBottomMask: !!document.querySelector(".intro-bottom-mask"),
            progressBarCount:
              document.querySelectorAll(".progress-fill").length,
            enterBottomPct: enterRect
              ? +(
                  ((stageRect.height - (enterRect.top - stageRect.top)) /
                    stageRect.height) *
                  100
                ).toFixed(1)
              : null,
            enterHeightPct: enterRect
              ? +((enterRect.height / stageRect.height) * 100).toFixed(1)
              : null,
          });
        }

        window.addEventListener("load", measure);
        window.addEventListener("resize", measure);
        window.addEventListener("orientationchange", function () {
          setTimeout(measure, 200);
        });
        // #endregion
      })();
    </script>
  </body>
</html>
