<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#02050a" />
    <title>Assist U 2 Win</title>
    <style>
      :root {
        --intro-aspect: 818 / 1092;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --cyan: #00f2fe;
        --bg: #02050a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: 100svh;
        background: var(--bg);
        color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-x: hidden;
        overscroll-behavior: none;
      }

      /* Full viewport — safe areas only (no extra shrink padding) */
      .intro-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        height: 100svh;
        padding:
          var(--safe-top)
          var(--safe-right)
          var(--safe-bottom)
          var(--safe-left);
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(0, 242, 254, 0.1),
            transparent 42%
          ),
          var(--bg);
      }

      /* Centering box — fills shell; art scales inside */
      .intro-frame {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }

      .intro-art-wrap {
        position: relative;
        display: inline-block;
        max-width: 100%;
        max-height: 100%;
        line-height: 0;
      }

      /*
       * As large as possible while fully visible (standard splash contain).
       * Uses both width and height limits — whichever binds first on that device.
       */
      .intro-art {
        display: block;
        width: auto;
        height: auto;
        max-width: min(
          calc(100vw - var(--safe-left) - var(--safe-right)),
          680px
        );
        max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
        max-height: calc(100svh - var(--safe-top) - var(--safe-bottom));
        object-fit: contain;
        object-position: center center;
        border-radius: clamp(8px, 2vw, 12px);
        box-shadow: 0 25px 60px rgba(0, 242, 254, 0.12);
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .intro-overlay {
        position: absolute;
        inset: 0;
        border-radius: clamp(8px, 2vw, 12px);
        pointer-events: none;
      }

      .intro-overlay > * {
        pointer-events: auto;
      }

      /* Percent positions track the splash art at any scale */
      .features-grid {
        position: absolute;
        left: 3.2%;
        right: 3.2%;
        top: 31.5%;
        height: 11.5%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(4px, 1.2vw, 8px);
      }

      .feature-card {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        cursor: pointer;
        font: inherit;
        color: inherit;
        touch-action: manipulation;
        transition:
          background 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .feature-card:hover,
      .feature-card:focus-visible {
        background: rgba(0, 242, 254, 0.05);
        border-color: rgba(0, 242, 254, 0.18);
        box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        outline: none;
      }

      .loading-zone {
        position: absolute;
        left: 11%;
        right: 11%;
        bottom: 13.5%;
        height: 7%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
      }

      .status-text,
      .operational-text {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .progress-track {
        width: 100%;
        height: clamp(6px, 1.2vh, 10px);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #00b4db, var(--cyan), #00b4db);
        background-size: 200% 100%;
        border-radius: inherit;
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.65);
        animation: loadPulse 3s linear infinite;
      }

      @keyframes loadPulse {
        0% {
          background-position: 100% 0%;
        }
        100% {
          background-position: -100% 0%;
        }
      }

      .enter-zone {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 2.5%;
        height: 9%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: max(0px, calc(var(--safe-bottom) * 0.25));
      }

      .enter-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 300px);
        min-height: 48px;
        padding: 14px 20px;
        border-radius: 12px;
        border: 1px solid rgba(0, 242, 254, 0.75);
        background: linear-gradient(180deg, #00f2fe, #0ea5e9 55%, #0369a1);
        color: #fff;
        font-size: clamp(11px, 3.2vw, 14px);
        font-weight: 800;
        letter-spacing: 0.14em;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow:
          0 0 28px rgba(0, 242, 254, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        touch-action: manipulation;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .enter-btn:hover {
        box-shadow: 0 0 36px rgba(0, 242, 254, 0.52);
      }

      .enter-btn:active {
        transform: scale(0.98);
      }

      /* Short phones */
      @media (max-height: 640px) {
        .features-grid {
          top: 30%;
          height: 10.5%;
        }

        .loading-zone {
          bottom: 12.5%;
          height: 6.5%;
        }

        .enter-zone {
          bottom: 2%;
          height: 8.5%;
        }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .features-grid {
          top: 29%;
          height: 12%;
        }

        .loading-zone {
          bottom: 11%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress-fill {
          animation: none;
          background-position: 0 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="intro-shell">
      <div class="intro-frame">
        <div class="intro-art-wrap">
          <img
            class="intro-art"
            src="/intro.png"
            alt="Assist U 2 Win — The Home Buying Collective"
            width="818"
            height="1092"
            decoding="async"
            fetchpriority="high"
          />

          <div class="intro-overlay" aria-hidden="false">
          <div class="features-grid" role="group" aria-label="Platform features">
            <button
              type="button"
              class="feature-card"
              aria-label="AI powered intelligent insights"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Smarter decisions data driven results"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Maximum value optimize every move"
            ></button>
            <button
              type="button"
              class="feature-card"
              aria-label="Trusted system secure reliable proven"
            ></button>
          </div>

          <div class="loading-zone" aria-live="polite">
            <p class="status-text">INITIALIZING COMMAND CENTER</p>
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
            <p class="operational-text">ALL SYSTEMS OPERATIONAL</p>
          </div>

          <div class="enter-zone">
            <a href="/dashboard" class="enter-btn">ENTER TO WIN</a>
          </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
