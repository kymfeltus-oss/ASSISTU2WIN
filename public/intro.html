<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Assist U 2 Win</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100dvh;
        background-color: #02050a;
        overflow-x: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Roboto, sans-serif;
      }

      .dashboard-container {
        --bg-url: url("/intro.png");
        position: relative;
        width: min(100vw - 24px, 550px);
        aspect-ratio: 818 / 1092;
        max-height: calc(100dvh - 24px);
        background-image: var(--bg-url);
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center top;
        border-radius: 12px;
        box-shadow: 0 25px 60px rgba(0, 242, 254, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header-spacer {
        flex: 4.1 1 0;
        min-height: 0;
      }

      .middle-spacer {
        flex: 3.4 1 0;
        min-height: 0;
      }

      .footer-spacer {
        flex: 0.2 1 0;
        min-height: 0;
      }

      .features-grid {
        flex: 1.3 1 0;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 0 15px;
      }

      .feature-card {
        margin: 0;
        padding: 0;
        border-radius: 12px;
        cursor: pointer;
        background: transparent;
        border: 1px solid transparent;
        transition: all 0.3s ease;
        font: inherit;
        color: inherit;
      }

      .feature-card:hover,
      .feature-card:focus-visible {
        background: rgba(0, 242, 254, 0.04);
        border-color: rgba(0, 242, 254, 0.15);
        box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
        outline: none;
      }

      .loading-zone {
        flex: 1.3 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 60px;
      }

      .status-text,
      .operational-text {
        opacity: 0;
        margin: 4px 0;
        pointer-events: none;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        overflow: hidden;
        margin: 5px 0;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      .progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #00b4db, #00f2fe, #00b4db);
        background-size: 200% 100%;
        border-radius: 10px;
        box-shadow: 0 0 12px #00f2fe;
        animation: loadPulse 3s infinite linear;
      }

      @keyframes loadPulse {
        0% {
          background-position: 100% 0%;
        }
        100% {
          background-position: -100% 0%;
        }
      }

      .enter-zone {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 48px 16px;
        width: 100%;
      }

      .enter-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 280px);
        padding: 14px 24px;
        border-radius: 12px;
        border: 1px solid rgba(0, 242, 254, 0.75);
        background: linear-gradient(180deg, #00f2fe, #0ea5e9 55%, #0369a1);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow:
          0 0 28px rgba(0, 242, 254, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .enter-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 36px rgba(0, 242, 254, 0.55);
      }

      .enter-btn:active {
        transform: scale(0.98);
      }

      @media (max-width: 400px) {
        .features-grid {
          gap: 4px;
          padding: 0 10px;
        }

        .loading-zone {
          padding: 0 36px;
        }

        .enter-zone {
          padding: 0 28px 12px;
        }

        .enter-btn {
          font-size: 12px;
          letter-spacing: 0.12em;
        }
      }

      @media (max-height: 700px) {
        .dashboard-container {
          width: min(92vw, 420px);
          max-height: 96dvh;
        }

        .header-spacer {
          flex: 3.6 1 0;
        }

        .middle-spacer {
          flex: 2.8 1 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="header-spacer"></div>

      <div class="features-grid" role="group" aria-label="Platform features">
        <button
          type="button"
          class="feature-card"
          aria-label="AI powered intelligent insights"
        ></button>
        <button
          type="button"
          class="feature-card"
          aria-label="Smarter decisions data driven results"
        ></button>
        <button
          type="button"
          class="feature-card"
          aria-label="Maximum value optimize every move"
        ></button>
        <button
          type="button"
          class="feature-card"
          aria-label="Trusted system secure reliable proven"
        ></button>
      </div>

      <div class="middle-spacer"></div>

      <div class="loading-zone" aria-live="polite">
        <p class="status-text">INITIALIZING COMMAND CENTER</p>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <p class="operational-text">ALL SYSTEMS OPERATIONAL</p>
      </div>

      <div class="enter-zone">
        <a href="/dashboard" class="enter-btn">ENTER TO WIN</a>
      </div>

      <div class="footer-spacer"></div>
    </div>
  </body>
</html>
